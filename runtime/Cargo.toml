[package]
name = "ritter"
description = "A package for defining tree-sitter grammars alongside rust logic"
readme = "../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
keywords = ["parsing", "codegen"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter.workspace = true
ritter-macro = { path = "../macro", version = "0.1.0-pre.1" }
ritter-types = { path = "../types", version = "0.1.0-pre.1" }
log = "0.4"
# This one could be optional.
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
insta = "1.39"
tempfile = "3.2.0"
