[package]
name = "ritter-macro"
description = "Procedural macros for ritter"
readme = "../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
keywords = ["parsing", "codegen"]
categories = ["development-tools"]

[lib]
proc-macro = true
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = [ "full", "extra-traits" ] }
quote = "1"
proc-macro2 = "1"
ritter-common = { path = "../common", version = "0.1.0-pre.1" }
ritter-types = { path = "../types", version = "0.1.0-pre.1" }

[dev-dependencies]
insta = "1"
tempfile = "3"
