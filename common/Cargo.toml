[package]
name = "ritter-common"
description = "Shared logic for the ritter macro and tool"
readme = "../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
keywords = ["parsing", "codegen"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
ritter-types = { path = "../types", version = "0.1.0-pre.1" }
syn = { version = "2", features = [ "full", "extra-traits" ] }
proc-macro2 = "1"
quote = "1"

serde_json = "1"
itertools = "0.15"
