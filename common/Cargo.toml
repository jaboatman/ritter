[package]
name = "ritter-common"
description = "Shared logic for the ritter macro and tool"
readme = "../README.md"
repository = "https://github.com/otonoma/ritter"
version.workspace = true
authors.workspace = true
edition = "2024"
license = "MIT"
keywords = ["parsing", "codegen"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
ritter-types = { path = "../types" }
syn = { version = "2", features = [ "full", "extra-traits" ] }
proc-macro2 = "1"
quote = "1"

serde_json = "1"
itertools = "0.15"
