[workspace]
resolver = "2"
members = [
  "macro",
  "runtime",
  "tool",
  "example",
  "common", 
  "types",
]
[workspace.package]
version = "0.1.0-pre.1"
authors = [
  "Jason Boatman",
]

[workspace.dependencies]
# Used for latest features which aren't released yet.
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "8933cb7" }
tree-sitter-generate = { git = "https://github.com/tree-sitter/tree-sitter", rev = "8933cb7", default-features = false, features = ["load"] }

# tree-sitter = "0.26"
# tree-sitter-generate = { version = "0.26", default-features = false, features = ["load"] }
