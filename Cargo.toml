[workspace]
resolver = "2"
members = [
  "macro",
  "runtime",
  "tool",
  "example",
  "common", 
  "types",
]
[workspace.package]
version = "0.1.0-pre.1"
authors = [
  "Jason Boatman",
]

[workspace.dependencies]
tree-sitter = "0.26"
tree-sitter-generate = { version = "0.26", default-features = false, features = ["load"] }
